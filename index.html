<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pro Transaction Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>💳 Pro Transaction Manager</h1>

  <!-- CUSTOMER -->
  <div class="card">
    <input id="customerName" placeholder="Customer name">
    <button id="addCustomer">Add Customer</button>
    <select id="customers"></select>
    <button id="deleteCustomer" class="danger">Delete Customer</button>
  </div>

  <!-- TRANSACTION -->
  <div class="card">
    <input type="date" id="date">
    <input type="number" id="amount" placeholder="Amount">
    <select id="type">
      <option value="credit">Credit</option>
      <option value="debit">Debit</option>
    </select>
    <input id="note" placeholder="Note">
    <button id="addTxn">Add Transaction</button>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <input id="search" placeholder="Search notes...">
    <h3 id="balance">Balance: 0</h3>
    <h4 id="summary"></h4>
    <ul id="list"></ul>
    <button id="exportPdf">Export PDF</button>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div id="passwordModal" class="modal hidden">
  <div class="modal-box">
    <h3>🔐 Confirm Action</h3>
    <p id="modalText"></p>
    <input type="password" id="passwordInput" placeholder="Password">
    <div class="modal-actions">
      <button id="confirmBtn">Confirm</button>
      <button id="cancelBtn" class="cancel">Cancel</button>
    </div>
    <p id="errorMsg"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="script.js"></script>
</body>
</html>
