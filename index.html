<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pro Transaction Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="app">
    <h1>💳 Pro Transaction Manager</h1>

    <!-- Customer Panel -->
    <div class="card">
      <input id="customerName" placeholder="Customer name">
      <button id="addCustomer">Add Customer</button>
      <button id="deleteCustomer">Delete Customer</button>
      <select id="customers">
        <option value="">Select Customer</option>
      </select>
    </div>

    <!-- Transaction Panel -->
    <div class="card">
      <input type="date" id="date">
      <input type="number" id="amount" placeholder="Amount">
      <select id="type">
        <option value="credit">Credit</option>
        <option value="debit">Debit</option>
      </select>
      <input id="note" placeholder="Note">
      <button id="addTxn">Add Transaction</button>
    </div>

    <!-- History & Search -->
    <div class="card">
      <input id="search" placeholder="Search notes...">
      <h3 id="balance">Balance: 0</h3>
      <h4 id="summary"></h4>
      <ul id="list"></ul>
      <button id="exportPdf">Export PDF</button>
    </div>
  </div>

  <!-- Password Modal -->
  <div id="passwordModal" class="modal hidden">
    <div class="modal-content">
      <p id="modalText">Enter password:</p>
      <input type="password" id="passwordInput" placeholder="Password">
      <p id="errorMsg" class="error"></p>
      <div class="modal-buttons">
        <button id="confirmBtn">Confirm</button>
        <button id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
